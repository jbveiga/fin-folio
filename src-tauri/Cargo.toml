[package]
name = "finfolio"
version = "2.0.0"
description = "FinFolio: Local-First, Zero-Knowledge, Keyboard-Driven Personal Finance"
authors = ["FinFolio Team"]
edition = "2021"

[lib]
name = "finfolio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-clipboard-manager = "2.0.0"
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher", "functions"] }
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
zeroize = { version = "1.8.1", features = ["derive"] }
blake3 = "1.5.4"
rayon = "1.10.0"
encoding_rs = "0.8.35"
calamine = "0.37.0"
csv = "1.3.0"
lopdf = "0.34.0"
strsim = "0.11.1"
uuid = { version = "1.11.0", features = ["v7", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
thiserror = "2.0.3"
regex = "1.11.1"
aho-corasick = "1.1.3"
hex = "0.4.3"
libc = "0.2"
